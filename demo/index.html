<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>Office demo</title>
<style>
  :root {
    --background: #0a0a0a;
    --card: #171717;
    --card-foreground: #f5f5f5;
    --foreground: #f5f5f5;
    --muted-foreground: #a3a3a3;
    --border: #2b2b2b;
    --input: #262626;
    --ring: #4f8cff;
    --accent: #262626;
    --primary: #4f8cff;
    --destructive: #e5484d;
    --popover: #171717;
    --radius: 10px;
  }
  html, body { margin: 0; padding: 0; background: var(--background); color: var(--foreground); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  #page {
    max-width: 1280px;
    margin: 0 auto;
    min-height: 100vh;
  }
  #page.widget {
    max-width: 780px;
    padding: 32px 16px;
  }
  #root.widget-card {
    width: 780px;
    height: 460px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    padding: 16px;
    box-sizing: border-box;
    overflow: hidden;
  }
</style>
</head>
<body>
<div id="page">
  <div id="root"></div>
</div>
<script>
  if (new URLSearchParams(location.search).get("widget") === "1") {
    document.getElementById("page").classList.add("widget");
    document.getElementById("root").classList.add("widget-card");
  }
</script>
<script src="./bundle.js?t=BUILD_ID"></script>
</body>
</html>
